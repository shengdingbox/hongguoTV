name: Verify Kotlin standalone APK
on:
  push:
    branches: ['codex/kotlin-standalone']
    tags: ['kotlin-v*']
  pull_request:
    paths: ['kotlin-tv/**', '.github/workflows/kotlin-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Standard
            flavor: standard
            android5: 'false'
          - variant: Android5
            flavor: android5
            android5: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 安装兼容版原生工具链
        if: matrix.flavor == 'android5'
        run: sdkmanager 'ndk;27.1.12297006'
      - name: 核心测试、变体 Lint 与开发安装包
        run: >-
          ./kotlin-tv/gradlew -p kotlin-tv
          -PHONGGUOTV_BUILD_ANDROID5=${{ matrix.android5 }}
          :core:test :app:lint${{ matrix.variant }}Debug :app:assemble${{ matrix.variant }}Debug
          --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kotlin-native-${{ matrix.flavor }}-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-${{ matrix.flavor }}Debug.*
            kotlin-tv/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
