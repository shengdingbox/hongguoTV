name: hongguotv-github-release

services:
  runner:
    build: .
    image: hongguotv-github-release-runner:latest
    container_name: hongguotv-github-release-runner
    restart: unless-stopped
    init: true
    environment:
      RUNNER_REPOSITORY_URL: https://github.com/superhuluwa/hongguoTV
      RUNNER_NAME: hongguotv-release-debian
      RUNNER_LABELS: hongguotv-release
    volumes:
      - runner-state:/home/runner
      - build-data:/build-data:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  runner-state:
    name: hongguotv-github-release-runner-state
  build-data:
    external: true
    name: hongguotv-android-build-data
